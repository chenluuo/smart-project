# agent 侧 4 服务 + 本地依赖（Redis / Milvus / MinIO 可选）
# 用法：docker compose -f agent/docker-compose.yml up -d
# 敏感配置经 .env 注入（agent/.env，不入库）
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    volumes: ["milvus-etcd:/etcd"]

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minios --console-address ":9001"
    volumes: ["milvus-minio:/minios"]

  milvus:
    image: milvusdb/milvus:v2.4-latest
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports: ["19530:19530", "9091:9091"]
    depends_on: ["milvus-etcd", "milvus-minio"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

  agent-service:
    build: {context: ., dockerfile: Dockerfile}
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    working_dir: /app/agent-service
    env_file: .env
    environment:
      GO_BASE_URL: ${GO_BASE_URL:-http://host.docker.internal:8080/api/v1}
    ports: ["8000:8000"]
    depends_on: ["redis", "minio"]

  context-service:
    build: {context: ., dockerfile: Dockerfile}
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    working_dir: /app/context-service
    env_file: .env
    ports: ["8001:8001"]

  tool-service:
    build: {context: ., dockerfile: Dockerfile}
    command: uvicorn main:app --host 0.0.0.0 --port 8002
    working_dir: /app/tool-service
    env_file: .env
    ports: ["8002:8002"]
    depends_on: ["redis", "minio"]

  ingest-service:
    build: {context: ., dockerfile: Dockerfile}
    command: python worker.py
    working_dir: /app/ingest-service
    env_file: .env
    depends_on: ["redis", "minio", "milvus"]

volumes:
  milvus-etcd:
  milvus-minio:
  minio-data:
