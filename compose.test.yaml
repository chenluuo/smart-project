# Lightweight, isolated integration environment for frontend and Go API testing.
# It includes only agent-service so offline backlog delivery can be tested; the
# context, tool, ingest, and vector services remain part of the full compose.yaml.
name: smart-agriculture-test

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: smart_agriculture
      MYSQL_USER: smart_agriculture
      MYSQL_PASSWORD: smart_agriculture
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usmart_agriculture", "-psmart_agriculture"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1884:1883"
    volumes:
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  go-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      GIN_MODE: debug
      SERVER_PORT: "8080"
      DB_DSN: smart_agriculture:smart_agriculture@tcp(mysql:3306)/smart_agriculture?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true
      DB_MIGRATE: "true"
      JWT_SECRET: dev-test-jwt-secret-0123456789abcdef
      INTERNAL_SERVICE_KEY: dev-test-internal-key-0123456789abcdef
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      MQTT_ENABLED: "true"
      MQTT_BROKER_URL: tcp://mqtt:1883
      MQTT_TOPIC_PREFIX: agri
      OBJECT_STORAGE_ENABLED: "true"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: knowledge
      TDENGINE_ENABLED: "false"
      KNOWLEDGE_NOTIFY_URL: ""
      AGENT_ALERT_URL: ""
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mqtt:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  agent-service:
    build:
      context: ./agent
      dockerfile: Dockerfile
    image: smart-project-agent:offline-backlog-test
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    working_dir: /app/agent-service
    environment:
      LLM_API_KEY: test-placeholder
      EMBEDDING_API_KEY: test-placeholder
      JWT_SECRET: dev-test-jwt-secret-0123456789abcdef
      GO_INTERNAL_KEY: dev-test-internal-key-0123456789abcdef
      MINIO_SECRET_KEY: minioadmin
      REDIS_HOST: redis
      MILVUS_HOST: unused
      MINIO_ENDPOINT: minio:9000
      GO_BASE_URL: http://go-api:8080/api/v1
      CONTEXT_BASE_URL: http://context-service:8001
      TOOL_BASE_URL: http://tool-service:8002
    depends_on:
      go-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NGINX_CONFIG: nginx.test.conf
    ports:
      - "5174:80"
    depends_on:
      go-api:
        condition: service_healthy
      agent-service:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  mqtt-data:
  mqtt-log:
  minio-data:
