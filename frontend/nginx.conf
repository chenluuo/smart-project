# 前端 nginx 配置：静态托管 + 反代 Go(/api /actuator) 与 agent(/agent)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Go 后端（宿主 8080 映射；smart-go-api 容器在默认 bridge 网络，经 host.docker.internal 访问）
    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /actuator/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
    }

    # agent-service（同 compose 网络，服务名互通）；SSE 流式需关闭缓冲
    location /agent/ {
        proxy_pass http://agent-service:8000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
