# 前端 nginx 配置：静态托管 + 反代 Go(/api /actuator) 与 agent(/agent)
# 多副本负载均衡：upstream 用服务名（Docker DNS 轮询到所有副本）
upstream go_backend {
    server go-api:8080;
}
upstream agent_backend {
    server agent-service:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Go 后端（compose 网络内服务名）
    location /api/ {
        proxy_pass http://go_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /actuator/ {
        proxy_pass http://go_backend;
        proxy_set_header Host $host;
    }

    # agent-service（多副本轮询）；SSE 流式需关闭缓冲、不重试
    location /agent/ {
        proxy_pass http://agent_backend;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_next_upstream off;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
